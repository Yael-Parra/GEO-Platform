<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Where the data comes from"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6F6154"/></marker></defs><rect width="1000" height="440" rx="18" fill="#F7F3EC"/><text x="40" y="52" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#3E1D26" text-anchor="start">Where the data comes from</text><text x="40" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6F6154" text-anchor="start">The same questions, to the same AIs, for you and your competitors</text><text x="150" y="128" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Your questions</text><rect x="40" y="148" width="220" height="64" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="150" y="176" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Which developers are</text><text x="150" y="194" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">most reliable in Madrid?</text><rect x="40" y="230" width="220" height="64" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="150" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Is it safe to</text><text x="150" y="276" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">buy off-plan?</text><rect x="40" y="312" width="220" height="64" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="150" y="340" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">What does the price</text><text x="150" y="358" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">of a home include?</text><text x="500" y="128" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">The AIs your customers use</text><rect x="400" y="150" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="177" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">ChatGPT</text><rect x="400" y="208" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="235" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">Gemini</text><rect x="400" y="266" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="293" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">Google</text><rect x="400" y="324" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="351" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">Perplexity</text><text x="850" y="128" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Your Ekko dashboard</text><rect x="740" y="150" width="220" height="44" rx="12" fill="#F6E3DB" stroke="#BE5A3C"/><text x="756" y="170" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Visibility</text><text x="756" y="186" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">whether you're named</text><rect x="740" y="208" width="220" height="44" rx="12" fill="#FCFAF6" stroke="#E6DBC8"/><text x="756" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Competitors</text><text x="756" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">who is ahead</text><rect x="740" y="266" width="220" height="44" rx="12" fill="#FCFAF6" stroke="#E6DBC8"/><text x="756" y="286" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Sources</text><text x="756" y="302" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">which sites the AI reads</text><rect x="740" y="324" width="220" height="44" rx="12" fill="#FCFAF6" stroke="#E6DBC8"/><text x="756" y="344" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Accuracy</text><text x="756" y="360" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">whether it gets your facts right</text><path d="M266 268H392" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><path d="M606 268H732" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><text x="329" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#A94A2E" text-anchor="middle">every week</text><text x="669" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#A94A2E" text-anchor="middle">3 times each</text><text x="500" y="410" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Each question is asked 3 times to tell real changes from noise.</text></svg>