<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="How Ekko works"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6F6154"/></marker></defs><rect width="1000" height="360" rx="18" fill="#F7F3EC"/><text x="40" y="52" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#3E1D26" text-anchor="start">How Ekko works</text><text x="40" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6F6154" text-anchor="start">A repeating cycle: from the buyer's question to a measured change</text><rect x="22.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="52.0" cy="142" r="15" fill="#BE5A3C"/><text x="52.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">1</text><text x="76.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Ask</text><text x="108.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Asks the AIs the</text><text x="108.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">questions your</text><text x="108.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">buyers ask</text><path d="M197.0 180.0H215.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="218.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="248.0" cy="142" r="15" fill="#BE5A3C"/><text x="248.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">2</text><text x="272.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Listen</text><text x="304.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Checks if they name you,</text><text x="304.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">in what position and</text><text x="304.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">what they say about you</text><path d="M393.0 180.0H411.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="414.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="444.0" cy="142" r="15" fill="#BE5A3C"/><text x="444.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">3</text><text x="468.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Explain</text><text x="500.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Tells you why: which</text><text x="500.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">competitor, which AI</text><text x="500.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">and which source</text><path d="M589.0 180.0H607.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="610.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="640.0" cy="142" r="15" fill="#BE5A3C"/><text x="640.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">4</text><text x="664.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Propose</text><text x="696.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Prepares changes</text><text x="696.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">checked against your</text><text x="696.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">sector's rules</text><path d="M785.0 180.0H803.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="806.0" y="110" width="172" height="140" rx="16" fill="#F6E3DB" stroke="#BE5A3C" stroke-width="2"/><circle cx="836.0" cy="142" r="15" fill="#BE5A3C"/><text x="836.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">5</text><text x="860.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Measure</text><text x="892.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Compares before and</text><text x="892.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">after to know</text><text x="892.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">whether it worked</text><path d="M892.0 253V310H108.0V256" fill="none" stroke="#BE5A3C" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="500.0" y="294" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#A94A2E" text-anchor="middle">And round again with what was learned</text></svg>