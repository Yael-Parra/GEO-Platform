<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="De dónde salen los datos"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6F6154"/></marker></defs><rect width="1000" height="440" rx="18" fill="#F7F3EC"/><text x="40" y="52" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#3E1D26" text-anchor="start">De dónde salen los datos</text><text x="40" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6F6154" text-anchor="start">Las mismas preguntas, a las mismas IAs, para ti y para tu competencia</text><text x="150" y="128" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Tus preguntas</text><rect x="40" y="148" width="220" height="64" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="150" y="176" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">¿Qué promotoras son</text><text x="150" y="194" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">más fiables en Madrid?</text><rect x="40" y="230" width="220" height="64" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="150" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">¿Es seguro comprar</text><text x="150" y="276" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">sobre plano?</text><rect x="40" y="312" width="220" height="64" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="150" y="340" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">¿Qué incluye el precio</text><text x="150" y="358" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">de una vivienda?</text><text x="500" y="128" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Las IAs que usa tu cliente</text><rect x="400" y="150" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="177" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">ChatGPT</text><rect x="400" y="208" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="235" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">Gemini</text><rect x="400" y="266" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="293" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">Google</text><rect x="400" y="324" width="200" height="44" rx="22" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="351" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#3E1D26" text-anchor="middle">Perplexity</text><text x="850" y="128" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Tu panel en Ekko</text><rect x="740" y="150" width="220" height="44" rx="12" fill="#F6E3DB" stroke="#BE5A3C"/><text x="756" y="170" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Visibilidad</text><text x="756" y="186" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">si te nombran</text><rect x="740" y="208" width="220" height="44" rx="12" fill="#FCFAF6" stroke="#E6DBC8"/><text x="756" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Competencia</text><text x="756" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">quién va por delante</text><rect x="740" y="266" width="220" height="44" rx="12" fill="#FCFAF6" stroke="#E6DBC8"/><text x="756" y="286" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Fuentes</text><text x="756" y="302" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">qué webs lee la IA</text><rect x="740" y="324" width="220" height="44" rx="12" fill="#FCFAF6" stroke="#E6DBC8"/><text x="756" y="344" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3E1D26" text-anchor="start">Exactitud</text><text x="756" y="360" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6F6154" text-anchor="start">si dice bien tus datos</text><path d="M266 268H392" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><path d="M606 268H732" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><text x="329" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#A94A2E" text-anchor="middle">cada semana</text><text x="669" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#A94A2E" text-anchor="middle">3 veces cada una</text><text x="500" y="410" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Cada pregunta se repite 3 veces para separar los cambios reales del ruido.</text></svg>