<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Cómo funciona Ekko"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6F6154"/></marker></defs><rect width="1000" height="360" rx="18" fill="#F7F3EC"/><text x="40" y="52" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#3E1D26" text-anchor="start">Cómo funciona Ekko</text><text x="40" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6F6154" text-anchor="start">Un ciclo que se repite: de la pregunta del comprador al cambio medido</text><rect x="22.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="52.0" cy="142" r="15" fill="#BE5A3C"/><text x="52.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">1</text><text x="76.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Pregunta</text><text x="108.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Lanza a las IAs las</text><text x="108.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">preguntas que hacen</text><text x="108.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">tus compradores</text><path d="M197.0 180.0H215.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="218.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="248.0" cy="142" r="15" fill="#BE5A3C"/><text x="248.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">2</text><text x="272.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Escucha</text><text x="304.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Mira si te nombran,</text><text x="304.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">en qué puesto y</text><text x="304.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">qué dicen de ti</text><path d="M393.0 180.0H411.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="414.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="444.0" cy="142" r="15" fill="#BE5A3C"/><text x="444.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">3</text><text x="468.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Explica</text><text x="500.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Te dice por qué:</text><text x="500.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">qué competidor, qué IA</text><text x="500.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">y qué fuente</text><path d="M589.0 180.0H607.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="610.0" y="110" width="172" height="140" rx="16" fill="#FCFAF6" stroke="#E6DBC8" stroke-width="1.2"/><circle cx="640.0" cy="142" r="15" fill="#BE5A3C"/><text x="640.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">4</text><text x="664.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Propone</text><text x="696.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Prepara cambios</text><text x="696.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">revisados con las</text><text x="696.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">normas de tu sector</text><path d="M785.0 180.0H803.0" stroke="#6F6154" stroke-width="1.5" marker-end="url(#a)"/><rect x="806.0" y="110" width="172" height="140" rx="16" fill="#F6E3DB" stroke="#BE5A3C" stroke-width="2"/><circle cx="836.0" cy="142" r="15" fill="#BE5A3C"/><text x="836.0" y="147" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FCFAF6" text-anchor="middle">5</text><text x="860.0" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3E1D26" text-anchor="start">Mide</text><text x="892.0" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Compara antes y</text><text x="892.0" y="210" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">después para saber</text><text x="892.0" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">si funcionó</text><path d="M892.0 253V310H108.0V256" fill="none" stroke="#BE5A3C" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="500.0" y="294" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#A94A2E" text-anchor="middle">Y vuelta a empezar con lo aprendido</text></svg>