<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Cuándo usar Ekko"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6F6154"/></marker></defs><rect width="1000" height="340" rx="18" fill="#F7F3EC"/><text x="40" y="52" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#3E1D26" text-anchor="start">Cuándo usar Ekko</text><text x="40" y="80" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6F6154" text-anchor="start">Cinco momentos en los que Ekko te ayuda a decidir</text><path d="M60 150H940" stroke="#E6DBC8" stroke-width="3"/><circle cx="100" cy="150" r="14" fill="#BE5A3C" stroke="#BE5A3C" stroke-width="2"/><rect x="10" y="184" width="180" height="120" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="100" y="214" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Antes de empezar</text><text x="100" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Check gratis: en 2</text><text x="100" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">minutos sabes si la IA</text><text x="100" y="280" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">te nombra</text><circle cx="300" cy="150" r="10" fill="#FCFAF6" stroke="#BE5A3C" stroke-width="2"/><rect x="210" y="184" width="180" height="120" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="300" y="214" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Cada semana</text><text x="300" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Mira qué ha cambiado</text><text x="300" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">y por qué</text><circle cx="500" cy="150" r="10" fill="#FCFAF6" stroke="#BE5A3C" stroke-width="2"/><rect x="410" y="184" width="180" height="120" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="500" y="214" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Cuando algo cae</text><text x="500" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">El aviso te dice quién</text><text x="500" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">te adelanta y en qué IA</text><circle cx="700" cy="150" r="10" fill="#FCFAF6" stroke="#BE5A3C" stroke-width="2"/><rect x="610" y="184" width="180" height="120" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="700" y="214" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E1D26" text-anchor="middle">Antes de publicar</text><text x="700" y="244" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">Prueba el cambio y</text><text x="700" y="262" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">revisa las normas</text><text x="700" y="280" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6F6154" text-anchor="middle">de tu sector</text><circle cx="900" cy="150" r="14" fill="#BE5A3C" stroke="#BE5A3C" stroke-width="2"/><rect x="810" y="184" width="180" height="120" rx="14" fill="#FCFAF6" stroke="#E6DBC8"/><text x="900" y="214" font-family="Inter, Arial, Helvetica, sans-seri