<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekko · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* VOICE: cálido, cercano, premium; un panel que se lee como un informe bien hecho.
   IDEA: el eco, la marca resonando en las respuestas de la IA.
   PICTURE: anillos de eco en el check; en el panel, la gráfica principal y la cuota de voz.
   COLOUR and TYPE: Ekko v2, 70 % crema, 20 % oxblood, 10 % sienna. Space Grotesk + Inter.
   LAYOUT: barra superior con cinco secciones; cada sección, una pantalla con bloques. */
:root{color-scheme:light dark;
--bg:light-dark(#F7F3EC,#1A0E12);--card:light-dark(#FCFAF6,#24151A);--deep:light-dark(#F1E9DB,#2E1B21);
--line:light-dark(#E6DBC8,#432B31);--taupe:light-dark(#8A7B6C,#9C8B7C);--mut:light-dark(#6F6154,#C2B1A2);
--ink:light-dark(#3E1D26,#F3E9DF);--sienna:light-dark(#BE5A3C,#D9714F);--sd:light-dark(#A94A2E,#E5876A);
--rose:light-dark(#A04A5A,#D77E8E);--onacc:#FCFAF6;--ox:#3E1D26;
--s1:light-dark(#3E1D26,#F3E9DF);--s2:light-dark(#6B3B45,#D9BFB6);--s3:light-dark(#9A6A6F,#A98E8C);--s4:light-dark(#C9AFA7,#6E5258);--s5:light-dark(#E6DBC8,#432B31);
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow-x:clip}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,40px);font-weight:600}
h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sd);outline-offset:2px;border-radius:8px}
.tab{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:13px}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
/* barra */
.top{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px max(4vw,16px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font:700 22px var(--fd);letter-spacing:-.02em;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:none;padding:10px 14px;border-radius:100px;font-weight:600;color:var(--mut);min-height:40px}
.nav button[aria-current=page]{background:var(--ink);color:var(--bg)}
.client{font-size:13px;color:var(--mut);white-space:nowrap}
@media(max-width:760px){.client{display:none}.nav{order:3;flex-basis:100%}}
/* estructura */
main{max-width:1240px;margin:auto;padding:24px max(4vw,16px) 80px}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.vh>div:first-child{flex:1 1 420px}
.vh p{margin-top:8px;color:var(--mut);max-width:68ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.c>h2,.c>.ch{margin-bottom:12px}
.ch{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}.ch>div{flex:1}
.ch .sub{font-size:13px;color:var(--mut);margin-top:4px}
@media(min-width:900px){.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s7{grid-column:span 7}.s5{grid-column:span 5}}
.btn{border:0;border-radius:100px;padding:10px 18px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--sd);color:var(--onacc)}
.btn.sec{background:none;border:1px solid var(--ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:100px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
button.chip{min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:100px;background:var(--deep);white-space:nowrap}
.tag.br{background:color-mix(in oklab,var(--sienna) 18%,var(--card))}
/* estados: icono + texto, una chispa */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--sd)}.st.warn{color:var(--ink)}.st.bad{color:var(--rose)}.st.none{color:var(--mut)}
.note{background:var(--deep);border-left:3px solid var(--sienna);border-radius:8px;padding:12px 14px}
.err{border:1px solid var(--rose);border-radius:8px;padding:12px 14px;background:var(--card)}
/* kpis */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.kpi[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kpi .v{font:600 clamp(26px,3vw,34px)/1 var(--fd);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--mut);font-weight:500}
.kpi .l{font-size:13px;font-weight:600;color:var(--mut)}
.kpi .d{font-size:12px}
/* barras */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(6rem,9rem) minmax(0,1fr) 4.6rem;gap:10px;align-items:center;border:0;background:none;padding:6px;border-radius:10px;text-align:left;width:100%}
button.bar:hover{background:var(--deep)}
.bar .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:12px;border-radius:100px;background:var(--deep);position:relative;overflow:hidden}
.bar .t i{position:absolute;inset:0 auto 0 0;border-radius:100px;background:var(--s3)}
.bar.own .t i{background:var(--sienna)}
.bar .t b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar .bv{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.sel{background:var(--deep)}.bar.dim{opacity:.4}
@media(max-width:520px){.bar{grid-template-columns:minmax(5.5rem,7rem) minmax(0,1fr) 3.8rem}}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:var(--fb);font-size:12px;fill:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
/* aviso */
.aviso{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--ox);color:#F3E9DF;border-radius:16px;padding:18px 20px;margin-bottom:16px}
.aviso .ic{width:40px;height:40px;border-radius:50%;background:var(--sienna);display:grid;place-items:center;color:#FCFAF6;font-weight:700}
.aviso h2{color:#FCFAF6;margin:4px 0 8px}
.aviso ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:#E6DBC8;font-size:14px}
.aviso .lab{color:#E6DBC8}
.aviso .btn.sec{border-color:#E6DBC8;color:#F3E9DF}
.aviso .acts{display:flex;flex-direction:column;gap:8px}
@media(max-width:760px){.aviso{grid-template-columns:1fr}.aviso .acts{flex-direction:row;flex-wrap:wrap}}
/* tablas */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
/* preguntas */
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qopen{all:unset;cursor:pointer;font-weight:600;display:block}
.qopen:hover{text-decoration:underline;text-underline-offset:3px}
.qopen:focus-visible{outline:2px solid var(--sd)}
.qv{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.qv .pct{font:600 18px var(--fd);min-width:3.2rem;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:620px){.qrow{grid-template-columns:1fr}.qv{justify-content:flex-start}}
.inp{border:1px solid var(--taupe);border-radius:12px;background:var(--card);padding:10px 12px;min-height:44px;font-size:16px;width:100%}
textarea.inp{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
/* drawer y modal */
.back{position:fixed;inset:0;background:rgba(30,12,18,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(34rem,100vw);background:var(--bg);z-index:51;overflow:auto;padding:20px 22px 40px;border-left:1px solid var(--line)}
.drawer section{border-top:1px solid var(--line);padding:16px 0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(36rem,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--bg);border-radius:18px;z-index:51;padding:22px;border:1px solid var(--line)}
.x{border:1px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;font-size:18px}
/* heatmap */
.heat{display:grid;gap:3px;font-size:13px}
.heat .h{font-size:12px;color:var(--mut);font-weight:600;padding:4px;display:flex;align-items:flex-end}
.heat .a{font-weight:600;padding:6px 4px;display:flex;align-items:center}
.heat .cell{border-radius:6px;display:grid;place-items:center;min-height:34px;font-variant-numeric:tabular-nums}
/* acciones */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr))}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.act .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.draft{background:var(--deep);border-radius:10px;padding:10px 12px;font-size:14px}
.draft del{color:var(--rose)}
.ba{display:flex;gap:8px;flex-wrap:wrap}.ba>div{flex:1 1 9rem;border-radius:10px;padding:10px;background:color-mix(in oklab,var(--sienna) 14%,var(--card))}
.ba>div.p{background:none;border:1px dashed var(--taupe)}
.ba b{display:block;font:600 20px var(--fd)}
/* check */
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:center;min-height:62vh}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.hero h1{font-size:clamp(32px,4.6vw,52px);font-weight:700;letter-spacing:-.02em}
.rings{position:relative;aspect-ratio:1;max-width:520px;width:100%;margin:auto}
.rings svg{width:100%;height:100%}
.ring{fill:none;stroke:var(--sienna);transform-origin:50% 50%;transform-box:view-box}
.pulse .ring{animation:ripple 3.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.25);opacity:.5}to{transform:scale(1);opacity:0}}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center}
.big{font:700 clamp(44px,7vw,76px)/.9 var(--fd);color:var(--sienna);font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.stepper span{flex:1 1 8rem;border-top:3px solid var(--line);padding-top:8px;font-size:13px;font-weight:600;color:var(--mut)}
.stepper span.on{border-color:var(--sienna);color:var(--ink)}
.plans{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
.plan{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:6px}
.plan[aria-pressed=true]{border:2px solid var(--ink)}
.plan .pr{font:700 26px var(--fd)}
.plan ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--mut)}
.meter{height:14px;border-radius:100px;background:var(--deep);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--sienna);border-radius:100px}
.meter b{position:absolute;top:0;bottom:0;left:80%;width:2px;background:var(--ink)}
.formula{font-size:13px;background:var(--deep);border-radius:10px;padding:10px 12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:46px;height:28px;border-radius:100px;border:1px solid var(--taupe);background:var(--deep);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--taupe);transition:left .2s}
.sw[aria-checked=true]{background:var(--sd);border-color:var(--sd)}.sw[aria-checked=true]::after{left:21px;background:#FCFAF6}
details.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:16px}
details.blk>summary{cursor:pointer;padding:16px 20px;font:600 17px var(--fd);list-style:none;display:flex;justify-content:space-between;gap:12px}
details.blk>summary::after{content:"▾";color:var(--mut)}
details.blk[open]>summary::after{content:"▴"}
details.blk>div{padding:0 20px 20px}
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:100px;font-weight:600;z-index:80;transition:transform .3s;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.tour-hole{position:fixed;z-index:90;border-radius:16px;box-shadow:0 0 0 9999px rgba(30,12,18,.55),0 0 0 3px var(--sienna);pointer-events:none;transition:all .25s}
.tour-tip{position:fixed;z-index:91;width:min(22rem,calc(100vw - 32px));background:var(--ox);color:#F3E9DF;border-radius:16px;padding:16px}
.tour-tip h3{color:#FCFAF6;margin:4px 0 6px}
.tour-tip .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.tour-tip .btn.sec{border-color:#E6DBC8;color:#F3E9DF}
.foot{margin-top:28px;font-size:12px;color:var(--mut)}
.soon{font-size:11px;font-weight:600;border:1px dashed var(--taupe);color:var(--mut);border-radius:100px;padding:2px 8px;white-space:nowrap}
.lang{position:relative}
#langSlot{margin-left:auto}
.lang-b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:100px;padding:6px 12px;min-height:40px;font-weight:600;font-size:13px}
.lang svg{width:22px;height:15px;border-radius:3px;flex:none;box-shadow:0 0 0 1px var(--line)}
.lang-m{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:10rem;z-index:40;box-shadow:0 10px 30px rgba(30,12,18,.15)}
.lang-m button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left;min-height:44px}
.lang-m button:hover{background:var(--deep)}
.lang-m button[aria-checked=true]{background:var(--ink);color:var(--bg)}
.client+#langSlot{margin-left:0}
@media(max-width:760px){.client+#langSlot{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
 <button class="logo" data-go="check" aria-label="Ekko"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#BE5A3C" stroke-opacity=".3" stroke-width="2"/><circle cx="20" cy="20" r="12" fill="none" stroke="#BE5A3C" stroke-opacity=".6" stroke-width="2"/><circle cx="20" cy="20" r="6" fill="#BE5A3C"/></svg>ekko</button>
 <nav class="nav" id="nav" aria-label="Secciones"></nav>
 <span class="client" id="client"></span>
 <div id="langSlot"></div>
</div></header>
<main id="app" tabindex="-1"></main>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
{
/* ======== DATOS DE EJEMPLO / SAMPLE DATA: todo es ficticio, everything is fictional ======== */
const S={lang:"es",view:"check",mi:4,metric:"vis",eng:null,comp:null,qf:{fase:"all",tipo:"all",tema:"",q:""},qopen:null,accTab:"todo",plan:"esencial",addons:{},alerts:{mail:true,slack:false,rank:true,acc:true,weekly:true},check:"idle",altaStep:0,selEng:"Perplexity",topic:0,probe:null};
const t=(es,en)=>S.lang==="en"?en:es;
const B=(es,en)=>({es,en});
const L=x=>x&&typeof x==="object"&&"es" in x?x[S.lang]:x;
const BRAND="Alvenca",WEB="alvenca.example";
const MONTHS=["2026-07","2026-08","2026-09","2026-10","2026-11"];
const MS={es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const ML={es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],en:["January","February","March","April","May","June","July","August","September","October","November","December"]};
const MES=m=>MS[S.lang][+m.slice(5)-1]+" "+m.slice(2,4);
const MESL=m=>ML[S.lang][+m.slice(5)-1]+" "+m.slice(0,4);
const ord=n=>S.lang==="en"?n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th"):n+"º";
const ENG=["ChatGPT","Gemini","AI Overview","AI Mode","Perplexity"];
const EXTRA=[{n:"Claude",p:39},{n:"Copilot",p:39}];
const N_MONTH=1800,N_ENG=360;
const ENGV={ChatGPT:[15,16.5,19,18,24.1],Gemini:[14,15,17.5,17,20.4],"AI Overview":[17,17.5,19,18.5,23.5],"AI Mode":[12,13,14.5,14,16.5],Perplexity:[13,13,14,13,12.5]};
const K={sov:[9.8,10.4,11.6,11.2,13.1],cit:[1.2,1.4,1.9,2.0,3.1],sent:[68,70,71,69,73],pos:[4.8,4.6,4.1,4.3,3.6],acc:[72,74,76,78,84]};
K.vis=MONTHS.map((_,i)=>+(ENG.reduce((s,e)=>s+ENGV[e][i],0)/ENG.length).toFixed(1));
const COMPS=["Morvela Homes","Trelisa Residencial","Quintavía","Brevanto","Solenca Homes"];
const SOV={"Morvela Homes":[18.1,17.6,17.2,17.5,16.4],"Trelisa Residencial":[15.2,15.8,16.1,15.4,14.9],"Quintavía":[12.0,12.4,11.0,12.6,12.0],"Brevanto":[10.5,10.1,11.9,11.8,10.2],"Solenca Homes":[8.2,8.0,7.4,8.9,8.6]};
SOV[BRAND]=K.sov;
const MTX_NOV={"Morvela Homes":[31.0,21.0,26.0,26.3,15.0],"Trelisa Residencial":[22.0,22.4,19.5,18.0,19.8],"Quintavía":[17.0,16.0,15.5,14.0,13.0],"Brevanto":[14.0,13.5,12.0,12.5,10.0],"Solenca Homes":[11.0,10.0,9.5,9.0,8.0]};
